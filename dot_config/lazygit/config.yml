# notARepository: skip

git:
  tabWidth: 2
  pagers:
    - pager: delta --dark --paging=never --line-numbers --side-by-side
    - externalDiffCommand: difft --color=always --syntax-highlight=on --tab-width=2
    - {} # plain diff fallback
os:
  edit: "nvim {{filename}}"
  open: "open {{filename}}"
gui:
  commandLogSize: 2
  mainPanelSplitMode: vertical
  sidePanelWidth: 0.2
  theme:
    selectedLineBgColor:
      - reverse
    inactiveViewSelectedLineBgColor:
      - default
